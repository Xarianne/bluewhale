---
name: Sync upstream image template

on:
  schedule:
    - cron: '17 08 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open upstream sync PR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync upstream template files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ublue-os/image-template.git
          git fetch --no-tags upstream main

          git switch -c automation/upstream-template-sync
          backup_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "${backup_dir}"

          # Copy the upstream snapshot without requiring shared Git history.
          git checkout FETCH_HEAD -- .

          # Restore files that are intentionally owned by Bluewhale rather
          # than inherited wholesale from the template.
          preserve_paths=(
            "Containerfile"
            "Justfile"
            ".containerignore"
            ".gitignore"
            "README.md"
            "LICENSE"
            "artifacthub-repo.yml"
            "cosign.pub"
            "image-template.env"
            "build_files"
            "system_files"
            "disk_config"
            ".github/workflows/build.yml"
            ".github/workflows/build-disk.yml"
            ".github/workflows/upstream-sync.yml"
            ".github/renovate.json5"
            ".github/dependabot.yml"
          )

          for path in "${preserve_paths[@]}"; do
            if [[ -d "${backup_dir}/${path}" ]]; then
              mkdir -p "${GITHUB_WORKSPACE}/${path}"
              cp -a "${backup_dir}/${path}/." "${GITHUB_WORKSPACE}/${path}/"
            elif [[ -f "${backup_dir}/${path}" ]]; then
              mkdir -p "${GITHUB_WORKSPACE}/$(dirname "${path}")"
              cp -a "${backup_dir}/${path}" "${GITHUB_WORKSPACE}/${path}"
            fi
          done

          git add --all
          git diff --cached --quiet || git commit -m "Sync upstream image template"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/upstream-template-sync
          delete-branch: true
          title: "Sync upstream image template"
          commit-message: "Sync upstream image template"
          body: |
            This PR syncs the current file snapshot from
            `ublue-os/image-template` into Bluewhale.

            Bluewhale-owned package, branding, workflow, and ISO files are
            intentionally preserved. Review all other changes carefully.
