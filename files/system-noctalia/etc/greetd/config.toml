# Noctalia Greeter as the login screen (replaces GDM).
# The greetd package ships a default config running agreety; this overrides it
# (rpm %config(noreplace) keeps this file and writes the packaged one as .rpmnew).
# `user` must be "greetd": that is the user Fedora's greetd sysusers.d entry creates.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greetd"
