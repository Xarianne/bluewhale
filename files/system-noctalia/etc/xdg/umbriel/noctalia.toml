# bluewhale default Noctalia-generated Umbriel palette (Catppuccin Mocha).
# Included from config.toml via [include]; user files in ~/.config/umbriel/
# take precedence, so copying this file there is how you override it.
# Generated by Noctalia's theming module ( noctalia msg theme ... ); re-sync
# occasionally with the values Noctalia writes for the active theme.

[colors]
background = "#313244FF"
text_primary = "#cdd6f4FF"
text_muted = "#a6adc8FF"
accent_primary = "#74c7ecFF"
accent_secondary = "#89b4faFF"
warning = "#89dcebFF"
error = "#f38ba8FF"
insert_hint = "#89dceb80"
backdrop = "#313244FF"

[colors.border]
focused = "#74c7ecFF"
unfocused = "#313244FF"
scratchpad_focused = "#89dcebFF"
scratchpad_unfocused = "#1893aaFF"
outer = "#1e1e2eFF"

[colors.overview]
background_tint = "#1e1e2e88"
badge = "#74c7ecFF"
workspace_background = "#1e1e2eFF"
