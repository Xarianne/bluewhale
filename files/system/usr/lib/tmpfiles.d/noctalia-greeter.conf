# State dir for noctalia-greeter (synced wallpaper/palette/font from Noctalia).
# On atomic images /var is per-deployment, so this must be created at boot.
# The Terra package deliberately removes the upstream tmpfiles.d fallback, so
# we provide our own. Owned by the "greetd" user (Fedora's greetd package).
d /var/lib/noctalia-greeter 0755 greetd greetd -
