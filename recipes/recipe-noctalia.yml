---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluewhale
# description will be included in the image's metadata
description: This is my personal OS image. Not meant for distribution.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora/fedora-silverblue
image-version: 44 # latest is also supported if you want new updates ASAP

# this variant builds as ghcr.io/.../bluewhale:noctalia
# (alt-tags replace the default latest/timestamp tags; the DMS variant
# gets :main the same way from its own recipe)
alt-tags:
  - noctalia

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: justfiles

  # Split build logic into smaller files to keep this readable.
  # rpmfusion.yml must come first: it adds the RPM Fusion repos which
  # later modules install from (e.g. steam).
  - from-file: packages/rpmfusion.yml
  - from-file: packages/ublue.yml
  - type: script # must come after ublue.yml (needs ublue-os-just installed)
    scripts:
      - hide-ujust-recipes.sh # hide unwanted upstream ujust recipes from listings, see docs/ublue-packages.md
  - from-file: packages/packages.yml
  - from-file: packages/repos.yml
  - from-file: packages/flatpaks.yml
  - from-file: packages/noctalia.yml

  - type: brew
    direct-pull: true
    nofile-limits: true # increase nofile limits
    brew-analytics: true

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - flatpak-system-update.timer # from ublue-os-update-services
        - greetd.service # Noctalia Greeter replaces GDM as the login screen
      disabled:
        - gdm.service
    user:
      enabled:
        - flatpak-user-update.timer # from ublue-os-update-services

  - type: kargs
    arch: x86_64
    kargs:
        - amdgpu.ppfeaturemask=0xffffffff # AMD overclocking

  - type: initramfs # rebuild includes tpm2-tss module → LUKS TPM2 auto-unlock works (ublue base does this too)

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
