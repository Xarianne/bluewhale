---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluewhale-noctalia
# description will be included in the image's metadata
description: Experimental Noctalia/Umbriel variant of my personal OS image. Not meant for distribution.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44 # latest is also supported if you want new updates ASAP

# builds as ghcr.io/.../bluewhale-noctalia:latest (plus :44 and timestamp tags)

# Module configuration, executed in order
# Can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /
      - source: system-noctalia
        destination: /

  - type: justfiles

  # RPM Fusion + multimedia codecs.
  - type: script
    scripts:
      - rpm-fusion-codecs.sh

  - from-file: packages/packages.yml
  - from-file: packages/flatpaks.yml
  - from-file: packages/noctalia.yml

  - type: brew
    direct-pull: true
    nofile-limits: true
    brew-analytics: true

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - input-remapper.service

  - type: kargs
    arch: x86_64
    kargs:
        - amdgpu.ppfeaturemask=0xffffffff # AMD overclocking

  - type: initramfs # allows use of LUKS TPM2 auto-unlock works as it includes necessary intramfs module

  - type: signing # Cosign
