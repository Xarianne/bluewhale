# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Pull in Universal Blue's ujust setup and udev rules from their official
# COPR, so we automatically track upstream changes on each rebuild.
# See docs/ublue-packages.md for details.
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
    install:
      packages:
        - ublue-os-just
        - ublue-os-udev-rules
        - ublue-os-update-services
        - uupd
        # Tools used by ujust recipes
        - distrobox
        - dmidecode
        - fpaste
        - jq
        - mokutil
