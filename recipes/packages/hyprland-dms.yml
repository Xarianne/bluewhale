---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

modules:
# Desktop plumbing: everything the no-desktop base lacks.
- type: dnf
  install:
    packages:
      - polkit
      - gnome-keyring
      - gnome-keyring-pam # pam_gnome_keyring.so, referenced by greetd's PAM stack
      - upower
      - accountsservice
      - xdg-user-dirs
      - nautilus
      - gvfs # Allows file managers to see disk and network mounts
      - gnome-text-editor
      - vdirsyncer # syncs calendar ICS links
      - fuse # needed for some appimages

- type: dnf
  repos:
    cleanup: true
    copr:
      - xariann/tools
  install:
    packages:
      - nautilus-copy-path

- type: dnf
  repos:
    copr:
    - lionheartp/Hyprland
  install:
    packages:
    - hyprland

- type: dnf
  repos:
    cleanup: true
    keys:
      # keep the terraXX version in sync with image-version in the main recipe
      - https://repos.fyralabs.com/terra44/key.asc
    files:
      - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
  install:
    packages:
      - ghostty # terminal; not in the Fedora repos, Terra only
    
- type: dnf
  repos:
    copr:
    - avengemedia/danklinux
    - avengemedia/dms
  install:
    packages:
    - cava
    - dankcalendar-git # no stable build in the COPR; -git only
    - dcal
    - dgop
    - dms
    - dms-greeter # greeter; runs under greetd, configured via files/system-hyprland
    - dsearch
    - matugen
    - quickshell
    - qt6-qtmultimedia # Fedora's name for qt6-multimedia

- type: systemd
  system:
    enabled:
      - greetd.service

# Calendar integration
- type: dnf
  install:
    packages:
      - khal
      - vdirsyncer 
      - python3-aiohttp-oauthlib

