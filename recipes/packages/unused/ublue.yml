# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Pull in Universal Blue's ujust setup and update-service units from their
# official COPR, so we automatically track upstream changes on each rebuild.
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
    install:
      packages:
        - ublue-os-just
        - ublue-os-update-services
