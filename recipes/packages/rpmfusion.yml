# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# RPM Fusion repos. Only remaining consumer: steam (rpmfusion-nonfree).
# The codec swap (ffmpeg/mesa freeworld) was dropped — media codecs come from
# app-side bundles now (Mozilla's official Firefox tarball; Flathub runtimes
# for players/editors). See docs/rpmfusion.md.
#
# Must stay first in every recipe: later modules install from these repos.
modules:
  - type: dnf
    install:
      packages:
        # Pinned to the master mirror, not mirrors.rpmfusion.org (the
        # redirector has served garbage from out-of-sync mirrors and broken
        # builds; dnf URL downloads don't retry across mirrors).
        - https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
        - https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
