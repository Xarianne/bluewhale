# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# RPM Fusion for multimedia codecs and mesa (freeworld versions with
# patented codec support, replacing Fedora's stripped builds).
# Implemented as a script rather than dnf modules: the build needs exact
# control over transaction order and flags across Fedora streams (released /
# branched / rawhide). See docs/rpmfusion.md for details.
#
# Must stay first in every recipe: it adds the RPM Fusion repos which later
# modules install from (e.g. steam).
modules:
  - type: script
    scripts:
      - rpmfusion.sh
