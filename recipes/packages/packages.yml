# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
- type: dnf
  repos:
    cleanup: true
    copr:
      - xariann/tools
  install:
    packages:
      - boot-windows

- type: dnf
  install:
    packages:
      # Gaming
      - steam
      - input-remapper
      # Everything else
      - bat
      - eza
      - fastfetch
      - fish
      - fuse-libs # Needed for some appimages
      - fzf
      - gh
      - gum
      - just
      - trash-cli
      - zoxide

- type: dnf
  repos:
    cleanup: true
    keys:
      # keep the terraXX version in sync with image-version in the main recipe
      - https://repos.fyralabs.com/terra44/key.asc
    files:
      - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
  install:
    packages:
      - fresh
      - starship
      - superfile
      - topgrade
