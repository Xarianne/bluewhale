# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - xariann/tools
    install:
      packages:
        - boot-windows
        - nautilus-copy-path

  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
    install:
      packages:
        - ghostty

  - type: dnf
    install:
      packages:
        # Gaming
        - steam
        - input-remapper
        # Everything else
        - bat
        - eza
        - fastfetch
        - fuse-libs # Needed for some appimages, fuse already in image
        - fzf
        - gum
        - trash-cli
        - zoxide

    remove:
      packages:
        - fedora-flathub-remote
