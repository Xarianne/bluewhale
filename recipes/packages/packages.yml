# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: dnf
    install:
      packages:
        # Gaming
        - steam
        - goverlay
        - input-remapper
        # Everything else
        - bat
        - eza
        - fastfetch
        - fuse-libs # Needed for some appimages, fuse already in image
        - fish
        - fzf
        - gum
        - zoxide

    remove:
      packages:
        - fedora-flathub-remote # Shipping in the Fedora base; we use Flathub instead
