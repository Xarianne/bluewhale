# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: dnf
    install:
      packages:
        # Gaming
        - steam
        - goverlay
        - input-remapper
        # Everything else
        - bat
        - eza
        - fastfetch
        - fuse-libs # Needed for some appimages, fuse already in image
        - fish
        - fzf
        - nextcloud-client
        - zoxide

    remove:
      packages:
        - fedora-flathub-remote # Using Flathub instead, might not be needed with Ublue base
