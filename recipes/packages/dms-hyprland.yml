# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# ----------------------------------------------------------------
#
# Run the dankinstall script after installing the dependencies below
# Link to the install script: https://danklinux.com/docs/getting-started
modules:
- type: dnf
  repos:
    copr:
    - avengemedia/danklinux
    - avengemedia/dms
    - sdegler/hyprland
  install:
    packages:
    - dgop
    - dnf-plugins-core
    - dms
    - golang-bin
    - hyprland
    - matugen
    - quickshell
