# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# ----------------------------------------------------------------
#
# Run the dankinstall script after installing the dependencies below
# Link to the install script: https://danklinux.com/docs/getting-started
modules:
- type: dnf
  repos:
    copr:
    - avengemedia/danklinux
    - avengemedia/dms
  install:
    packages:
    - dgop
    - dms
    - matugen
    - quickshell

- type: dnf
  repos:
    copr:
    - lionheartp/Hyprland
  install:
    packages:
    - hyprland

    exclude:
    - kitty # comes as a dep of hyprland

