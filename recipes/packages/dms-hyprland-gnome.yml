# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# ----------------------------------------------------------------
#
# Run the dankinstall script after installing the dependencies below
# Link to the install script: https://danklinux.com/docs/getting-started
modules:
- type: dnf
  repos:
    copr:
    - avengemedia/danklinux
    - avengemedia/dms
    - lionheartp/Hyprland
  install:
    packages:
    - dgop
    - dms
    - hyprland
    - matugen
    - quickshell
    # hyprland from the sdegler/hyprland COPR Recommends kitty; exclude stops
    # dnf pulling it in. A `remove:` block here is useless: within one dnf
    # module, remove runs BEFORE install.
    exclude:
    - kitty
