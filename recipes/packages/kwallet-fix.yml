# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Work around kf6-kwallet 6.29.0 dual-daemon issue where qtkeychain
# credentials (e.g. Nextcloud's OAuth tokens) don't persist across reboots.
#
# kf6-kwallet 6.29.0 ships both ksecretd (Secret Service) and kwalletd6
# (legacy KWallet API). qtkeychain prefers kwallet6 on Plasma, but the
# flatpak sandbox bundles its own kwalletd6 (via org.kde.Platform runtime)
# that can't be PAM-unlocked, so tokens written to it are lost on reboot.
#
# Two measures:
# 1. Mask the host's kwalletd6 D-Bus activation so only ksecretd runs on
#    the host. qtkeychain on host apps then falls through to libsecret.
# 2. Install a flatpak override that removes org.kde.kwalletd6 talk
#    permission from the Nextcloud flatpak. This prevents the sandbox
#    from activating its own kwalletd6, so qtkeychain uses libsecret via
#    the host's org.freedesktop.secrets (ksecretd, PAM-unlocked).
#
# The flatpak override must be applied at runtime (after flatpaks are
# installed) because /var/lib/flatpak is not committed to the ostree.
# A systemd user service (bluewhale-flatpak-overrides.service) runs
# the script at boot.
#
# Upstream issue: https://invent.kde.org/frameworks/kwallet/-/work_items/11
modules:
  - type: script
    snippets:
      - "ln -sf /dev/null /usr/share/dbus-1/services/org.kde.kwalletd6.service"
      - "mkdir -p /usr/libexec/bluewhale && cp files/scripts/apply-flatpak-overrides.sh /usr/libexec/bluewhale/apply-flatpak-overrides.sh && chmod +x /usr/libexec/bluewhale/apply-flatpak-overrides.sh"