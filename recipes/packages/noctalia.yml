# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Noctalia family: https://noctalia.dev/
#
# - noctalia:        desktop shell (v5), from the Fedora repos
# - umbriel-nightly: Wayland compositor, from Terra (no Fedora package yet)
# - noctalia-greeter + greetd: login screen, replaces Plasma login manager (PLM)
#   (wired up via files/system-noctalia/etc/greetd/config.toml and the
#   systemd module below)
modules:
# Desktop plumbing: everything the no-desktop base lacks.
- type: dnf
  install:
    packages:
      - polkit
      - gnome-keyring
      - gnome-keyring-pam # pam_gnome_keyring.so, referenced by greetd's PAM stack
      - upower
      - accountsservice
      - xdg-user-dirs
      - nautilus
      - gvfs # Allows file managers to see disk and network mounts
      - gnome-text-editor
      - vdirsyncer # syncs calendar ICS links
      - fuse # needed for some appimages

- type: dnf
  repos:
    cleanup: true
    copr:
      - xariann/tools
  install:
    packages:
      - nautilus-copy-path

- type: dnf
  repos:
    cleanup: true
    keys:
      # keep the terraXX version in sync with image-version in the main recipe
      - https://repos.fyralabs.com/terra44/key.asc
    files:
      - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
  install:
    packages:
      - noctalia
      - umbriel-nightly # pulls in xwayland-satellite and xdg-desktop-portal-umbriel-nightly
      - noctalia-greeter
      - greetd
      - ghostty # terminal; not in the Fedora repos, Terra only

- type: systemd
  system:
    enabled:
      - greetd.service

# Per-user calendar sync. The vdirsyncer Fedora package ships no systemd units,
# so upstream's contrib units are vendored in files/systemd/user/ — the systemd
# module auto-copies that directory into /usr/lib/systemd/user.
- type: systemd
  user:
    enabled:
      - vdirsyncer.timer

