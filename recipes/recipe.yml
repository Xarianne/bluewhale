---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluewhale
# description will be included in the image's metadata
description: This is my personal OS image. Not meant for distribution.

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 # latest is also supported if you want new updates ASAP

# builds as ghcr.io/.../bluewhale:latest (plus :44 and timestamp tags)

# Module configuration, executed in order
# Can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: justfiles

  - type: script
    scripts:
      - hide-ujust-recipes.sh

  - from-file: packages/packages.yml
  - from-file: packages/flatpaks.yml
  - from-file: packages/dms-hyprland-gnome.yml

  - type: brew
    direct-pull: true
    nofile-limits: true
    brew-analytics: true

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - input-remapper.service

  - type: kargs
    arch: x86_64
    kargs:
        - amdgpu.ppfeaturemask=0xffffffff # AMD overclocking

  - type: initramfs # allows use of LUKS TPM2 auto-unlock works as it includes necessary intramfs module

  - type: signing # Cosign
