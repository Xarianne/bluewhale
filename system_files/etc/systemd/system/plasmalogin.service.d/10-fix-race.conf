# Fix Plasma Login Manager race with accounts-daemon (RH #2483625).
# The greeter's QML singletons (Authenticator, UserModel, SessionModel, etc.)
# query AccountsService over D-Bus. If plasmalogin starts before accounts-daemon
# is ready, those singletons fail to initialize, the greeter shows a black screen
# with no users, and may crash with SIGSEGV.
[Unit]
After=accounts-daemon.service
Wants=accounts-daemon.service
